<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Visualization - To the Lighthouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            color: white;
            background-color: #03045e;
        }

        header {
            background-color: #0077b6;
            color: white;
            padding: 10px;
            text-align: left;
        }

        nav {
            margin-top: 10px;
            background-color: #023047;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-weight: bold;
            position: relative;
        }

        .container {
            background-color: #023047;
            padding: 20px;
            text-align: center;
            min-height: calc(100vh - 130px);
            box-sizing: border-box;
        }

        .container h1 {
            font-size: 2.5rem;
            color: #90e0ef;
        }

        .container select {
            background-color: #0077b6;
            color: white;
            font-size: 1rem;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            width: 300px;
            cursor: pointer;
        }

        .container select:hover {
            background-color: #023047;
            color: #90e0ef;
        }
        .back-button {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            border-radius: 25px; /* Bordi arrotondati */
            text-decoration: none;
            font-size: 1rem;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Ombra leggera */
            transition: all 0.3s ease; /* Transizione fluida */
        }

        .back-button:hover {
            background-color: #023047;
            color: #90e0ef; /* Colore di evidenziazione */
            transform: translateY(-3px); /* Effetto movimento */
            box-shadow: 0px 8px 12px rgba(0, 0, 0, 0.2); /* Ombra più pronunciata */
        }

        footer {
            margin-top: 20px;
            text-align: right;
            font-size: 0.8rem;
            padding-right: 20px;
            color: white;
        }
        
        .iframe-container {
            width: 100%;
            height: 600px;
            border: none;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .iframe-container {
                height: 400px;
            }
        }
    </style>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</head>
<body>
    <header>
        <h1>To the Lighthouse's Visualization</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="project.html">THE PROJECT</a>
        <a href="visualization.html">TO THE LIGHTHOUSE'S VISUALIZATION</a>
        <a href="about.html">ABOUT ME</a>
    </nav>
    <!-- Navigation back button -->
    <div class="navigation">
        <button class="back-button" onclick="goBack()">&#8592; Back</button>
    </div>

    <div class="container">
        <h1>Characters' List</h1>

        <!-- Selezione del personaggio tramite menu a tendina -->
        <label for="characterSelect">Choose a character:</label>
        <select id="characterSelect" onchange="loadVisualization(this.value)">
            <option value="">Select a character</option>
            <option value="Narrator">Narrator</option>
            <option value="Lily_Briscoe">Lily Briscoe</option>
            <option value="Mr_Ramsay">Mr. Ramsay</option>
            <option value="Mrs_Ramsay">Mrs. Ramsay</option>
            <option value="James_Ramsay">James Ramsay</option>
            <option value="Cam_Ramsay">Cam Ramsay</option>
            <option value="Mr_Tansley">Mr. Tansley</option>
            <option value="Mr_Carmichael">Mr. Carmichael</option>
            <option value="William_Bankes">William Bankes</option>
            <option value="Mrs_McNab">Mrs. McNab</option>
            <option value="Andrew_Ramsay">Andrew Ramsay</option>
            <option value="Prue_Ramsay">Prue Ramsay</option>
            <option value="Jasper_Ramsay">Jasper Ramsay</option>
            <option value="Nancy">Nancy</option>
            <option value="Roger">Roger</option>
            <option value="Minta_Doyle">Minta Doyle</option>
            <option value="Sorley">Sorley</option>
            <option value="Miss_Giddings">Miss Giddings</option>
            <option value="Paul_Rayley">Paul Rayley</option>
            <option value="Mrs_Bast">Mrs. Bast</option>
            <option value="George">George</option>
            <option value="Percy">Percy</option>
            <option value="Mildred">Mildred</option>
            <option value="Maggie">Maggie</option>
            <option value="Mrs_Beckwith">Mrs. Beckwith</option>
            <option value="Macalisters_boy">Macalister's boy</option>
            <option value="Macalister">Macalister</option>
            <option value="Charles">Charles</option>
        </select>
        <img src="path/to/top_10_characters_appearances.html" alt="Top 10 Characters Appearances" style="margin-top: 20px; max-width: 100%; height: auto;">

        <!-- Contenitore per le visualizzazioni -->
        <div id="visualization">
            <p>Select a character to view its sentiment within the story.</p>
        </div>
    </div>

    <footer>
        <p>by Nicole Biscaro</p>
        <p>CC BY-NC-SA 4.0</p>
    </footer>

    <script>
        // Funzione per caricare la visualizzazione interattiva per i personaggi
        function loadVisualization(character) {
            const visualizationContainer = document.getElementById('visualization');
            const githubPagesBaseUrl = "https://nicolebi99.github.io/To-the-lighthouse_analysis/";

            const characterFiles = {
                'Narrator': 'Narrator.html',
                'Lily_Briscoe': 'Lily_Briscoe.html',
                'Mr_Ramsay': 'Mr_Ramsay.html',
                'Mrs_Ramsay': 'Mrs_Ramsay.html',
                'James_Ramsay': 'James_Ramsay.html',
                'Cam_Ramsay': 'Cam_Ramsay.html',
                'Mr_Tansley': 'Mr_Tansley.html',
                'Andrew_Ramsay': 'Andrew_Ramsay.html',
                'Prue_Ramsay': 'Prue_Ramsay.html',
                'Mr_Carmichael': 'Mr_Carmichael.html',
                'William_Bankes': 'William_Bankes.html',
                'Mrs_McNab': 'Mrs_McNab.html',
                'Nancy': 'Nancy.html',
                'Jasper_Ramsay': 'Jasper_Ramsay.html',
                'Roger': 'Roger.html',
                'Minta_Doyle': 'Minta_Doyle.html',
                'Sorley': 'Sorley.html',
                'Miss_Giddings': 'Miss_Giddings.html',
                'Paul_Rayley': 'Paul_Rayley.html',
                'Mrs_Bast': 'Mrs_Bast.html',
                'George': 'George.html',
                'Percy': 'Percy.html',
                'Mildred': 'Mildred.html',
                'Maggie': 'Maggie.html',
                'Mrs_Beckwith': 'Mrs_Beckwith.html',
                'Macalisters_boy': 'Macalisters_boy.html',
                'Macalister': 'Macalister.html',
                'Charles': 'Charles.html'
            };

            if (characterFiles[character]) {
                const fileUrl = `${githubPagesBaseUrl}${characterFiles[character]}`;
                visualizationContainer.innerHTML = `
                    <iframe src="${fileUrl}" class="iframe-container"></iframe>
                `;
            } else {
                visualizationContainer.innerHTML = '<p>Visualizzazione non disponibile per questo personaggio.</p>';
            }
        }
    </script>
</body>
</html>
