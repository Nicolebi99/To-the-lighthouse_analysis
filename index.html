<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Visualization - To the Lighthouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            color: white;
            background-color: #03045e;
        }

        header {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            text-align: left;
            position: relative;
        }

        /* Titolo in stile Atlante di Calvino */
        h1 {
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.2rem;
        }

        h1 span {
            display: inline-block;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        h1 span:hover {
            transform: rotate(-10deg) scale(1.3);
            color: #90e0ef;
        }

        nav {
            margin-top: 10px;
            background-color: #023047;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-weight: bold;
            position: relative;
            transition: color 0.3s;
        }

        /* Animazione sottolineatura */
        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: #90e0ef;
            transition: width 0.3s, left 0.3s;
        }
        nav a:hover {
            color: #90e0ef;
        }
        nav a:hover::after {
            width: 100%;
            left: 0;
        }

        .container {
            background-color: #023047;
            padding: 40px 20px;
            text-align: center;
            min-height: calc(100vh - 130px);
            box-sizing: border-box;
        }

        .center-button button {
            padding: 20px 40px;
            font-size: 1.5rem;
            border: 2px solid #90e0ef;
            border-radius: 8px;
            background-color: #023047;
            color: #90e0ef;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }
        .center-button button:hover {
            background-color: #90e0ef;
            color: #023047;
        }

        footer {
            margin-top: 30px;
            text-align: right;
            font-size: 0.8rem;
            padding-right: 20px;
            color: white;
        }
    </style>
</head>
<body>

    </header>
