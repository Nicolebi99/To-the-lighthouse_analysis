<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Visualization - To the Lighthouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            color: white;
            background: url('waves.jpg') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: overlay;
            background-color: rgba(3, 4, 94, 0.9);
        }

        header {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.2rem;
        }

        h1 span {
            display: inline-block;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        h1 span:hover {
            transform: rotate(-10deg) scale(1.3);
            color: #90e0ef;
        }

        nav {
            background-color: #023047;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
            position: relative;
            transition: color 0.3s;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: #90e0ef;
            transition: width 0.3s, left 0.3s;
        }

        nav a:hover {
            color: #90e0ef;
        }

        nav a:hover::after {
            width: 100%;
            left: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .novels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 20px;
            justify-items: center;
        }

        .novel-card {
            position: relative;
            width: 200px;
            height: 250px;
            background-color: #023047;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .novel-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .novel-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow: auto;
        }

        .modal-content {
            position: relative;
            background-color: #023047;
            margin: 10% auto;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            color: #caf0f8;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-top: 0;
            color: #90e0ef;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #caf0f8;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover {
            color: #90e0ef;
        }

        footer {
            margin-top: 30px;
            text-align: right;
            font-size: 0.8rem;
            padding-right: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span>T</span><span>o</span> <span>t</span><span>h</span><span>e</span> 
            <span>L</span><span>i</span><span>g</span><span>h</span><span>t</span><span>h</span><span>o</span><span>u</span><span>s</span><span>e</span>
        </h1>
    </header>

    <nav>
        <a href="index.html">HOME</a>
        <a href="project.html">THE PROJECT</a>
        <a href="visualization.html">TO THE LIGHTHOUSE'S VISUALIZATION</a>
        <a href="about.html">ABOUT ME</a>
    </nav>

    <div class="container">
        <h1>Digital and Public Humanities' project about To the Lighthouse</h1>

        <div class="novels-section">
            <h2>Atlas of Virginia Woolf's Works</h2>
            <div class="novels-grid">
                <div class="novel-card" onclick="showDetails('The Voyage Out')">
                    <img src="cruise.png" alt="A cruise ship" class="novel-icon">
                    <h3>The Voyage Out (1915)</h3>
                    <p>La crociera</p>
                </div>
                <div class="novel-card" onclick="showDetails('Night and Day')">
                    <img src="day-and-night-2.png" alt="Sun and Moon" class="novel-icon">
                    <h3>Night and Day (1919)</h3>
                    <p>Notte e giorno</p>
                </div>
                <!-- Other novels omitted for brevity -->
            </div>
        </div>
    </div>

    <!-- Modal HTML -->
    <div id="novel-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
        </div>
    </div>

    <footer>
        <p>by Nicole Biscaro</p>
        <p>CC BY-NC-SA 4.0</p>
    </footer>

    <script>
        const novelDescriptions = {
            "The Voyage Out": "Virginia Woolf’s debut novel, a voyage of self-discovery, set on a ship heading to South America.",
            "Night and Day": "A story that contrasts romantic ideals with social conventions in Edwardian London.",
            // Add descriptions for other novels
        };

        const modal = document.getElementById('novel-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDescription = document.getElementById('modal-description');

        function showDetails(title) {
            const description = novelDescriptions[title] || "Description not available.";
            modalTitle.textContent = title;
            modalDescription.textContent = description;
            modal.style.display = "block";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
